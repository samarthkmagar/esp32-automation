; =============================================================================
; ESP32 Smart-Home Controller + WoL Bridge
; PlatformIO Build Configuration
; =============================================================================
; Board: ESP32 DevKit V1 (ESP32-WROOM-32 module)
; Framework: Arduino
;
; Build & Upload:
;   pio run                     # compile
;   pio run -t upload           # flash via USB
;   pio device monitor          # serial monitor (115200 baud)
;   pio run -t upload && pio device monitor   # flash + monitor
; =============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; --- Library Dependencies ---
lib_deps =
    bblanchon/ArduinoJson@^7.0.0

; --- Build Flags ---
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -Wall

; --- Upload Settings ---
; Uncomment and set the port if auto-detection fails:
; upload_port = COM3            ; Windows
; upload_port = /dev/ttyUSB0    ; Linux
; upload_speed = 921600         ; Faster upload (default 460800)

; --- OTA Upload (future use) ---
; Uncomment for OTA updates after initial USB flash:
; upload_protocol = espota
; upload_port = esp32-controller.local
